services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: standbharat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-standbharat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standbharat_password}
      POSTGRES_DB: ${POSTGRES_DB:-standbharat_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-standbharat_user} -d ${POSTGRES_DB:-standbharat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: standbharat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Controlled pre-deployment database migration runner
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standbharat_migration
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-standbharat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standbharat_password}
      POSTGRES_DB: ${POSTGRES_DB:-standbharat_db}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}
      DB_ENCRYPTION_FALLBACK_TO_SECRET_KEY: ${DB_ENCRYPTION_FALLBACK_TO_SECRET_KEY:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standbharat_backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-standbharat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standbharat_password}
      POSTGRES_DB: ${POSTGRES_DB:-standbharat_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}
      DB_ENCRYPTION_FALLBACK_TO_SECRET_KEY: ${DB_ENCRYPTION_FALLBACK_TO_SECRET_KEY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/api/integrations/oauth/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-storage/documents}
      STORAGE_MAX_UPLOAD_SIZE_BYTES: ${STORAGE_MAX_UPLOAD_SIZE_BYTES:-26214400}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_LOCAL_DIR: ${BACKUP_LOCAL_DIR:-storage/backups/postgresql}
      BACKUP_STORAGE_BACKEND: ${BACKUP_STORAGE_BACKEND:-local}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/postgresql}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_ENCRYPTION_ENABLED: ${BACKUP_ENCRYPTION_ENABLED:-false}
    volumes:
      - documents_data:/app/storage/documents
      - backups_data:/app/storage/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standbharat_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-c", "4"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-standbharat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standbharat_password}
      POSTGRES_DB: ${POSTGRES_DB:-standbharat_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}
      DB_ENCRYPTION_FALLBACK_TO_SECRET_KEY: ${DB_ENCRYPTION_FALLBACK_TO_SECRET_KEY:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-storage/documents}
      STORAGE_MAX_UPLOAD_SIZE_BYTES: ${STORAGE_MAX_UPLOAD_SIZE_BYTES:-26214400}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_LOCAL_DIR: ${BACKUP_LOCAL_DIR:-storage/backups/postgresql}
      BACKUP_STORAGE_BACKEND: ${BACKUP_STORAGE_BACKEND:-local}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/postgresql}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_ENCRYPTION_ENABLED: ${BACKUP_ENCRYPTION_ENABLED:-false}
    volumes:
      - documents_data:/app/storage/documents
      - backups_data:/app/storage/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app status || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standbharat_beat
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-standbharat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standbharat_password}
      POSTGRES_DB: ${POSTGRES_DB:-standbharat_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_DATA_MODE: api
    container_name: standbharat_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_DATA_MODE: api
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  documents_data:
  backups_data:
