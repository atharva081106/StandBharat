version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: standbharat_db
    environment:
      POSTGRES_USER: standbharat_user
      POSTGRES_PASSWORD: standbharat_password
      POSTGRES_DB: standbharat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standbharat_user -d standbharat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: standbharat_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
